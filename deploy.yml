---
#
# BASTION LLD Architecture
#

project:
  name: bastion
  author: "Frederic PERREAU"
  description: Mise en oeuvre d'un airgap pour des opérations automatisées contrôlées manuellement.

  hypervisors:
    - name: bastion
      description: Secure Hypervisor
      type: vm
      image: IncusOS
      parent: null
      fqdn: bastion.home.arpa
      addresses: []
      ressources:
        cpu: 4
        memory: 16G     
      disks:
        - name: root
          size: 50G
          type: root
          pool: local

      containers:
        - name: the-bastion
          type: lxc
          image: "images:debian/13"
          addresses: []
          limits:
            cpu: 2
            memory: 4G
          volumes:
            - name: root
              size: 20G
              type: root
          services:
            - name: vault-ssh
              type: port
              map:  2220:22
        - name: vault
          type: oci
          image: "docker.io/hashicorp/vault:latest"
          addresses: []
          limits:
            cpu: 1
            memory: 4G
          volumes:
            - name: config
              size: 1G
              type: files
              mount: "zvol0/vault-config:/vault/config.d"
            - name: vault
              size: 4G
              type: files
              mount: "zvol0/vault-file:/vault/file"
            - name: logs
              size: 10G
              type: files
              mount: "zvol0/vault-logs:/vault/logs"
          services:
            - name: vault-ssh
              type: lxc
              map:  8200/tcp:8200
        - name: media
          type: lxc
          image: "images:alpha/latest"
          fqdn: media.bastion.home.arpa
          addresses: []
          limits:
            cpu: 1
            memory: 4G
          volumes:
            - name: media-input
              size: 10G
              type: files
              mount: zvol0/media-input:/input"
            - name: media-output
              size: 10G
              type: files
              mount: "zvol0/media-output:/output"
          services:
            - name: media-ssh
              type: port
              map:  22222:22
          config:
            - name: rsync services
              exec: |-
                sudo apt update
                sudo apt install -y rsync
                sudo systemctl enable rsync
